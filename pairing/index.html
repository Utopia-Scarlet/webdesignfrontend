<body class="pairing-page">

    <!-- This page used to be the pairing room: choose a partner, wait for one,
         type a code. None of that is a step anyone has to take any more. An
         account has its own space from the moment it is made, and a shared
         space is joined by asking, not by pairing.

         So the address is kept, and it decides nothing. It hands the visitor
         to the one resolver that does: signed in, Our Space; signed out, the
         Entrance. An old link that still carries an invitation goes to the
         invitation instead, because that is what the person following it was
         trying to do. -->
    <div class="pairing" id="pairing">

        <header class="pairing__chrome">
            <span class="pairing__brand">Love / Story</span>
        </header>

        <main class="pairing__stage" id="pairingStage" aria-live="polite">
            <p class="pairing__loading">One moment&hellip;</p>
        </main>
    </div>
