<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <main class="welcome">
        <div class="overlay"></div>

        <div class="welcome-content">

            <h1>Love Story</h1>

            <p>
                Every memory deserves to be remembered.
            </p>

            <button class="start-button">
                Start
            </button>

        </div>
        <button class="login-button">Login</button>
        <div class="overlay-model">
            <div class="login-model">
                <div class="buttoncontiner">
                    <button class="close-button">❌</button>
                </div>
                <div class="loginblock">
                    <h2 class="logintitle">Login</h2>
                    <label class="usernamelabel">username</label>
                    <input class = "logininput1">
                    <label class="passwordlabel">password</label>
                    <input class = "logininput2">
                </div>
                <div class="loginbuttoncontiner">
                    <button class="login">
                        LOGIN!
                    </button>
                </div>
            </div>
        </div>
    </main>

</body>

</html>
